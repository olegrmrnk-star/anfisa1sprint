{% load static %}
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
    <div class="container">
      <div
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav" 
        aria-expanded="false" 
        aria-label="Toggle navigation"
        >
        <span class="navbar-toggler-icon"></span>
      </div>
      <div class="collapse navbar-collapse" id="navbarNav">                      
        <ul class="nav nav-pills">
          <li class="nav-item">
            {% with request.resolver_match.view_name as view_name %}
            <a class="nav-link {% if view_name  == 'homepage:index' %}active{% endif %}" 
              href="{% url 'homepage:index' %}">
              Главная
            </a>
            {% endwith %}
          </li>
          <li class="nav-item">
            {% with request.resolver_match.view_name as view_name %}
            <a class="nav-link {% if view_name  == 'ice_cream:ice_cream_list' %}active{% endif %}"
              href="{% url 'ice_cream:ice_cream_list' %}">
              Каталог мороженого
            </a>
            {% endwith %} 
          </li>
          <li class="nav-item">
            {% with request.resolver_match.view_name as view_name %}
            <a class="nav-link {% if view_name  == 'about:description' %}active{% endif %}"
              href="{% url 'about:description' %}">
              О проекте
            </a>
            {% endwith %}
          </li>
        </ul>
      </div> 
      <a class="navbar-brand" href="{% url 'homepage:index' %}">
        <img src="{% static 'img/logo.png' %}" class="d-inline-block align-top" height="50" alt="">            
      </a>         
    </div>
  </nav>
</header>
